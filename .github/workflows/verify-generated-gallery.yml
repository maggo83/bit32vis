name: Verify BitSquiggles generated outputs

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install optional renderer system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 openjfx
      - name: Compile headless Java core module
        run: |
          mkdir -p out/core out/renderer-swing out/renderer-javafx out/test
          javac -d out/core java/core/module-info.java \
            java/core/bitsquiggles/BitSquiggles.java \
            java/core/bitsquiggles/internal/BitSquigglesCore.java \
            java/core/bitsquiggles/GalleryGenerator.java \
            java/core/bitsquiggles/ConformanceFixtureGenerator.java
      - name: Compile optional Java2D renderer module
        run: |
          javac -d out/renderer-swing --module-path out/core java/renderer-swing/module-info.java \
            java/renderer-swing/bitsquiggles/renderer/swing/BitSquigglesRendererSwing.java
      - name: Compile optional JavaFX renderer module
        run: |
          javac -d out/renderer-javafx --module-path out/core:/usr/share/openjfx/lib \
            java/renderer-javafx/module-info.java \
            java/renderer-javafx/bitsquiggles/renderer/javafx/BitSquigglesRendererJavaFX.java
      - name: Compile Java test and demo sources
        run: |
          javac -d out/test -cp out/core:out/renderer-swing \
            java/core/bitsquiggles/BitSquigglesCoreTest.java \
            java/core/bitsquiggles/BitSquigglesDemo.java \
            java/renderer-swing/bitsquiggles/renderer/swing/BitSquigglesRendererSwingTest.java
      - name: Run Java tests
        run: |
          java -Xmx512m -cp out/core:out/renderer-swing:out/test bitsquiggles.BitSquigglesCoreTest
          java -cp out/core:out/renderer-swing:out/test bitsquiggles.renderer.swing.BitSquigglesRendererSwingTest
      - name: Verify generated example gallery
        run: java --module-path out/core --module io.github.maggo83.bitsquiggles/bitsquiggles.GalleryGenerator --check
      - name: Verify generated conformance fixtures
        run: java --module-path out/core --module io.github.maggo83.bitsquiggles/bitsquiggles.ConformanceFixtureGenerator --check
      - name: Install JavaScript development dependencies
        run: npm ci --prefix web
      - name: Run JavaScript core and playground tests
        run: npm test --prefix web
      - name: Run MicroPython-compatible tests under CPython
        run: |
          python3 micropython/generate_packed_tables.py --check
          python3 micropython/test_bitsquiggles_core.py
          python3 micropython/test_bitsquiggle_renderer_framebuffer.py
          python3 micropython/test_bitsquiggle_renderer_lvgl.py
      - name: Run Dart core and Flutter renderer tests
        working-directory: dart
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed bitsquiggles_core.dart bitsquiggles_renderer_flutter.dart test_bitsquiggles_core.dart test_bitsquiggles_web.dart test
          dart test_bitsquiggles_core.dart
          dart compile js -O2 test_bitsquiggles_web.dart -o /tmp/bitsquiggles_web_test.js
          node /tmp/bitsquiggles_web_test.js
          flutter analyze bitsquiggles_core.dart bitsquiggles_renderer_flutter.dart test_bitsquiggles_core.dart test
          flutter test
      - name: Run optional PyQt6 renderer tests
        run: |
          python3 -m pip install '.[pyqt6]'
          QT_QPA_PLATFORM=offscreen python3 micropython/test_bitsquiggle_renderer_pyqt6.py
      - name: Build and run C99 conformance tests
        run: make -C c test
